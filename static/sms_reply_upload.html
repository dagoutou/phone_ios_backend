<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短信回复图片上传</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 520px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 24px 32px;
        }
        .header h1 { font-size: 22px; font-weight: 600; }
        .header p { margin-top: 6px; opacity: 0.85; font-size: 13px; }
        .body { padding: 28px 32px; }
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .required { color: #e74c3c; margin-left: 2px; }
        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        .drop-zone {
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafbfc;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #667eea;
            background: #f0f3ff;
        }
        .drop-zone .icon {
            font-size: 36px;
            color: #a0aec0;
            margin-bottom: 8px;
        }
        .drop-zone .text { color: #4a5568; font-size: 14px; }
        .drop-zone .hint { color: #a0aec0; font-size: 12px; margin-top: 4px; }
        .preview {
            margin-top: 12px;
            position: relative;
            display: none;
        }
        .preview img {
            max-width: 100%;
            max-height: 240px;
            border-radius: 6px;
            display: block;
            border: 1px solid #eee;
        }
        .preview .remove {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
        }
        .progress {
            margin-top: 14px;
            height: 6px;
            background: #edf2f7;
            border-radius: 3px;
            overflow: hidden;
            display: none;
        }
        .progress .bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.2s;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 14px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }
        .result.success {
            background: #f0fff4;
            border: 1px solid #9ae6b4;
            color: #2f855a;
        }
        .result.error {
            background: #fff5f5;
            border: 1px solid #feb2b2;
            color: #c53030;
        }
        .result a {
            color: #2b6cb0;
            word-break: break-all;
        }
        .config-bar {
            background: #f7fafc;
            padding: 10px 32px;
            font-size: 12px;
            color: #718096;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .config-bar input {
            flex: 1;
            padding: 4px 8px;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
        }
        .nav-bar {
            display: flex;
            background: #f7fafc;
            border-bottom: 1px solid #edf2f7;
        }
        .nav-bar a {
            flex: 1;
            text-align: center;
            padding: 14px 0;
            text-decoration: none;
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .nav-bar a:hover { background: #edf2f7; }
        .nav-bar a.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: #f0f3ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="/sms_order_process.html">短信订单处理</a>
            <a href="/sms_reply_upload.html" class="active">短信回复图片上传</a>
        </div>
        <div class="header">
            <h1>短信回复图片上传</h1>
            <p>支持 PNG / JPG / JPEG，最大 10MB</p>
        </div>
        <div class="body">
            <form id="uploadForm">
                <div class="form-group">
                    <label>用户 ID <span class="required">*</span></label>
                    <input type="text" id="userId" placeholder="请输入 user_id">
                </div>
                <div class="form-group">
                    <label>订单号 <span class="required">*</span></label>
                    <input type="text" id="orderNo" placeholder="请输入 order_no">
                </div>
                <div class="form-group">
                    <label>回复图片 <span class="required">*</span></label>
                    <div class="drop-zone" id="dropZone">
                        <div class="icon">+</div>
                        <div class="text">点击选择或拖拽图片到此处</div>
                        <div class="hint">仅支持 .png / .jpg / .jpeg</div>
                        <input type="file" id="fileInput" accept=".png,.jpg,.jpeg,image/png,image/jpeg" hidden>
                    </div>
                    <div class="preview" id="preview">
                        <img id="previewImg" src="" alt="预览">
                        <button type="button" class="remove" id="removeBtn">×</button>
                    </div>
                    <div class="progress" id="progress">
                        <div class="bar" id="progressBar"></div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="submitBtn" disabled>上传</button>
                <div class="result" id="result"></div>
            </form>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const previewImg = document.getElementById('previewImg');
        const removeBtn = document.getElementById('removeBtn');
        const submitBtn = document.getElementById('submitBtn');
        const form = document.getElementById('uploadForm');
        const result = document.getElementById('result');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progressBar');
        const userIdInput = document.getElementById('userId');
        const orderNoInput = document.getElementById('orderNo');

        let selectedFile = null;

        function checkReady() {
            submitBtn.disabled = !(selectedFile && userIdInput.value.trim() && orderNoInput.value.trim());
        }
        userIdInput.addEventListener('input', checkReady);
        orderNoInput.addEventListener('input', checkReady);

        function setFile(file) {
            if (!file) return;
            const ext = (file.name.split('.').pop() || '').toLowerCase();
            if (!['png', 'jpg', 'jpeg'].includes(ext)) {
                showError('文件格式不支持，仅支持 png/jpg/jpeg');
                return;
            }
            if (file.size > 10 * 1024 * 1024) {
                showError('文件大小超过 10MB 限制');
                return;
            }
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
            hideResult();
            checkReady();
        }

        function clearFile() {
            selectedFile = null;
            fileInput.value = '';
            preview.style.display = 'none';
            previewImg.src = '';
            checkReady();
        }

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => setFile(e.target.files[0]));
        removeBtn.addEventListener('click', clearFile);

        ['dragenter', 'dragover'].forEach(evt => {
            dropZone.addEventListener(evt, (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
        });
        ['dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            });
        });
        dropZone.addEventListener('drop', (e) => {
            const file = e.dataTransfer.files[0];
            setFile(file);
        });

        function showSuccess(html) {
            result.className = 'result success';
            result.innerHTML = html;
            result.style.display = 'block';
        }
        function showError(msg) {
            result.className = 'result error';
            result.textContent = msg;
            result.style.display = 'block';
        }
        function hideResult() { result.style.display = 'none'; }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (submitBtn.disabled) return;

            const formData = new FormData();
            formData.append('user_id', userIdInput.value.trim());
            formData.append('order_no', orderNoInput.value.trim());
            formData.append('file', selectedFile);

            submitBtn.disabled = true;
            submitBtn.textContent = '上传中...';
            progress.style.display = 'block';
            progressBar.style.width = '0%';

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/v2/sms/reply/upload');
            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = percent + '%';
                }
            };
            xhr.onload = () => {
                submitBtn.disabled = false;
                submitBtn.textContent = '上传';
                let resp;
                try { resp = JSON.parse(xhr.responseText); } catch (_) { resp = null; }
                if (xhr.status >= 200 && xhr.status < 300 && resp && resp.code === 200) {
                    const data = resp.data || {};
                    showSuccess(
                        '上传成功！<br>' +
                        '回复 ID: <strong>' + (data.reply_id || '-') + '</strong><br>' +
                        '图片 URL: <a href="' + data.image_url + '" target="_blank">' + data.image_url + '</a>'
                    );
                } else {
                    const msg = (resp && (resp.message || resp.error)) || ('HTTP ' + xhr.status);
                    showError('上传失败: ' + msg);
                }
            };
            xhr.onerror = () => {
                submitBtn.disabled = false;
                submitBtn.textContent = '上传';
                showError('网络错误，请检查 API 地址或网络连接');
            };
            xhr.send(formData);
        });
    </script>
</body>
</html>
